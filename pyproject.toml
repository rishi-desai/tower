[project]
name = "tower"
# Required by uv, never released: tower's version lives in plugin/.claude-plugin/plugin.json.
version = "0.0.0"
description = "Run many Claude Code agents in parallel: status cards, a hub, and approval before anything public."
# The dev environment and the `tower` CLI use 3.11+. The hook scripts, and the parts of src/tower they import, are
# checked against older Pythons (ruff and mypy below), since a hook runs under whatever `python3` it finds, and macOS's
# /usr/bin/python3 is 3.9.
requires-python = ">=3.11"
# Standard library only at runtime: the hooks import src/tower straight from the plugin, with nothing installed.
dependencies = []

[project.scripts]
tower = "tower.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
strict = true
# mypy can't target 3.9 (its floor is 3.10); ruff's py39 target still catches newer syntax.
python_version = "3.10"
files = ["src", "plugin/scripts", "plugin/skills/hub/scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true

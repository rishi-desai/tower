[project]
name = "tower"
# Required by uv, never released: tower's version lives in plugin/.claude-plugin/plugin.json.
version = "0.0.0"
description = "Run many Claude Code agents in parallel: status cards, a hub, and approval before anything public."
# The dev environment uses 3.11+. The hook scripts themselves are checked against older Pythons (ruff and mypy below),
# since a hook runs under whatever `python3` it finds, and macOS's /usr/bin/python3 is 3.9.
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.uv]
# The hook scripts run as plain files under `python3 -I`; there is no package to build or install.
package = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
strict = true
# mypy can't target 3.9 (its floor is 3.10); ruff's py39 target still catches newer syntax.
python_version = "3.10"
files = ["plugin/scripts", "plugin/skills/hub/scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
